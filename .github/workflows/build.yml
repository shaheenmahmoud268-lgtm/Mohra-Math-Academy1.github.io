name: Build My App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Package & Website Folder
        run: |
          # 1. Setup dummy package.json
          echo '{ "name": "mohra-academy", "version": "1.0.0", "dependencies": { "@capacitor/core": "latest", "@capacitor/cli": "latest", "@capacitor/android": "latest", "@capacitor/ios": "latest" } }' > package.json
          
          # 2. Setup the website folder Capacitor expects
          mkdir www
          cp -r * www/ 2>/dev/null || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Capacitor
        run: npm install

      - name: Initialize App
        run: |
          npx cap init "Mohra Academy" "com.mohra.academy" --web-dir www
          npx cap add android
          npx cap add ios
          npx cap sync

      - name: Build Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build iOS (iPad Air 2 Support)
        run: |
          # Building using the Project file (.xcodeproj) since Workspace doesn't exist
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     IPHONEOS_DEPLOYMENT_TARGET=15.0 \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO

          # Package the built .app into a .ipa zip
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r App.ipa Payload

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: mohra-app-files
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            App.ipa
