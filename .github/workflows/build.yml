name: Build My App
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Package & Website Folder
        run: |
          echo '{ "name": "mohra-academy", "version": "1.0.0", "dependencies": { "@capacitor/core": "latest", "@capacitor/cli": "latest", "@capacitor/android": "latest", "@capacitor/ios": "latest" } }' > package.json
          mkdir www
          cp -r index.html www/ 2>/dev/null || true
          cp -r * www/ 2>/dev/null || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Capacitor
        run: npm install

      - name: Initialize App
        run: |
          npx cap init "Mohra Academy" "com.mohra.academy" --web-dir www
          npx cap add android
          # This forces the creation of the iOS folder properly
          npx cap add ios 
          npx cap sync

      - name: Build Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build iOS (iPad Air 2 Support)
        run: |
          # We check if the folder exists first to avoid Error 66
          ls -R ios/App/
          
          # We build specifically for older devices
          xcodebuild -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -configuration Debug \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     IPHONEOS_DEPLOYMENT_TARGET=15.0 

          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r App.ipa Payload

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: mohra-app-files
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            App.ipa
