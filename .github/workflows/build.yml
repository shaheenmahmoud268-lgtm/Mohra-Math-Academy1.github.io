name: Build My App
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install & Build
        run: |
          npm install
          npm run build --if-present
          
      - name: Add Mobile Folders
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/ios
          npx cap init "My App" "com.sample.app" --web-dir dist
          npx cap add android
          npx cap add ios
          npx cap sync
          
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug
          
      - name: Build iOS IPA
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphoneos -derivedDataPath build
          mkdir -p Payload
          cp -r build/Build/Products/Debug-iphoneos/App.app Payload/
          zip -r App.ipa Payload

      - name: Upload Files
        uses: actions/upload-artifact@v4
        with:
          name: my-app-files
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            App.ipa
